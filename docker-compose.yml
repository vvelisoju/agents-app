# Local/prod-like stack for the multi-agent SaaS backend.
# The client (client/) deploys separately as a static PWA (Vercel/Netlify) pointed at
# the server's public URL via VITE_API_URL.
#
# Run:  docker compose up --build
# Postgres: to use it, set DATABASE_URL below AND change the provider in
#   server/prisma/schema.prisma to "postgresql" (SQLite is the zero-setup default).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: agents
      POSTGRES_DB: agents
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['5432:5432']

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  server:
    build: ./server
    env_file: ./server/.env.production
    environment:
      PORT: '4000'
      # For Postgres, uncomment (and switch the prisma provider):
      # DATABASE_URL: 'postgresql://postgres:agents@postgres:5432/agents'
    ports: ['4001:4000']
    depends_on: [postgres, redis]

volumes:
  pgdata:
