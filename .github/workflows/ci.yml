# CI (FND-47 / QA-11). One workflow; later tasks add jobs (migration-diff guard QA-12,
# secret-scan QA-14, coverage gate QA-50, locked-decision guard QA-58, …).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test # includes the money/safety suite (FND-40) on an isolated SQLite DB (QA-01)

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # QA-51: client unit/component tests (vitest + Testing Library, jsdom)

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # QA-15: builds must be deterministic — no "latest" dependency specifiers.
      - name: No unpinned 'latest' dependencies
        run: |
          if grep -REn '"[^"]+":[[:space:]]*"latest"' server/package.json client/package.json package.json; then
            echo "::error::Unpinned 'latest' dependency found — pin to an exact version."
            exit 1
          fi
          echo "All dependencies are pinned."
      # QA-12: the prod boot path must never run a destructive schema sync.
      - name: No destructive schema sync on the prod path
        run: |
          if grep -REn 'accept-data-loss|force-reset|db push' server/docker-entrypoint.sh server/Dockerfile; then
            echo "::error::Destructive schema op on the prod path — use prisma migrate deploy."
            exit 1
          fi
          echo "Prod path uses migrate deploy only."
      # DB-5: the generated Postgres schema must stay in sync with schema.prisma.
      - name: Postgres schema in sync
        working-directory: server
        run: |
          node scripts/gen-pg-schema.js
          git diff --exit-code prisma/schema.postgres.prisma || {
            echo "::error::prisma/schema.postgres.prisma is stale — run npm run db:gen-pg and commit."
            exit 1
          }

  # QA-13: prove every committed migration applies cleanly on a real Postgres (the dev/test
  # suite runs on SQLite, so dialect drift in a migration would otherwise only surface in prod).
  postgres-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agents_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/agents_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Fresh DB → apply the full migration history (0_init onward) against Postgres.
      - run: npx prisma migrate deploy --schema prisma/schema.postgres.prisma
      # Then the recorded history must report up to date (no drift, no pending).
      - run: npx prisma migrate status --schema prisma/schema.postgres.prisma

  # QA-14: fail the build if a secret (key, token, credential) is committed.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan covers the pushed range
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
